# ==============================================================================
# GitLab CI/CD Pipeline - GitLab Pages Deployment
# Projeto: VotoConsciente 2026 (SP) - Analisador Político & Santinho Digital
# ==============================================================================

image: node:20-alpine

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/
    - node_modules/
    - packages/frontend/node_modules/
    - packages/backend/node_modules/

stages:
  - deploy

pages:
  stage: deploy
  before_script:
    - npm ci --cache .npm --prefer-offline || npm install
  script:
    # 1. Compila o frontend Vue 3 / Vite com cópia dos dados públicos de /data
    - npm run build -w @voto-consciente/frontend
    # 2. O GitLab Pages publica obrigatoriamente a pasta 'public/'
    - rm -rf public
    - cp -r packages/frontend/dist public
    # 3. Regras de roteamento para Single Page Application (SPA)
    - echo "/* /index.html 200" > public/_redirects
    - cp public/index.html public/404.html
    - echo "✓ Deploy estático pronto em public/ para publicação no GitLab Pages!"
  artifacts:
    paths:
      - public
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "master"'
